<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- figura en posición de estiramiento / yoga -->
  <!-- torso inclinado -->
  <ellipse cx="100" cy="42" rx="22" ry="24" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.1)" stroke-width="1.5"/>
  <!-- columna / torso extendido -->
  <path d="M 100,64 C 96,90 88,120 80,148" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="12" stroke-linecap="round"/>
  <!-- brazos extendidos (estiramiento) -->
  <path d="M 100,84 C 85,70 60,55 38,48" fill="none" stroke="rgba(94,234,212,.5)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 100,84 C 115,70 140,55 162,48" fill="none" stroke="rgba(94,234,212,.5)" stroke-width="8" stroke-linecap="round"/>
  <!-- MOVILIDAD — flujo de energía / arcos -->
  <path d="M 62,105 Q 100,85 138,105" fill="none" stroke="#2dd4bf" stroke-width="2.5" opacity=".8" stroke-dasharray="6,3"/>
  <path d="M 52,125 Q 100,100 148,125" fill="none" stroke="#2dd4bf" stroke-width="2" opacity=".6" stroke-dasharray="5,3"/>
  <path d="M 60,145 Q 100,120 140,145" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity=".4" stroke-dasharray="4,3"/>
  <!-- piernas abiertas / posición estiramiento -->
  <path d="M 80,148 C 70,168 55,188 44,208" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="11" stroke-linecap="round"/>
  <path d="M 80,148 C 92,168 106,188 118,208" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="11" stroke-linecap="round"/>
  <!-- highlight articulaciones -->
  <circle cx="100" cy="84" r="7" fill="rgba(45,212,191,.25)" stroke="#2dd4bf" stroke-width="1.8"/>
  <circle cx="80" cy="148" r="6" fill="rgba(45,212,191,.2)" stroke="#2dd4bf" stroke-width="1.5"/>
  <!-- label -->
  <text x="100" y="232" text-anchor="middle" font-family="Barlow,sans-serif" font-size="18" font-weight="800" fill="#2dd4bf" opacity=".85">MOVILIDAD</text>
</svg>
