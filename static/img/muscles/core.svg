<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- torso -->
  <path d="M 55,30 L 145,30 L 155,52 L 152,190 L 128,202 L 100,205 L 72,202 L 48,190 L 45,52 Z"
        fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.1)" stroke-width="1.5"/>
  <!-- pecho hint -->
  <polygon points="50,33 100,42 100,80 52,82" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
  <polygon points="100,42 150,33 148,82 100,80" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
  <!-- abs hint (subtle) -->
  <rect x="74" y="86" width="20" height="20" rx="4" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
  <rect x="106" y="86" width="20" height="20" rx="4" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
  <rect x="74" y="110" width="20" height="20" rx="4" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
  <rect x="106" y="110" width="20" height="20" rx="4" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
  <!-- OBLICUOS / CORE -->
  <!-- oblicuo izquierdo -->
  <polygon points="48,82 72,82 68,172 42,185"
           fill="rgba(251,191,36,.3)" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round"/>
  <!-- oblicuo derecho -->
  <polygon points="152,82 128,82 132,172 158,185"
           fill="rgba(251,191,36,.3)" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round"/>
  <!-- transverso (línea inferior) -->
  <path d="M 52,172 Q 100,178 148,172" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity=".5"/>
  <!-- label -->
  <text x="100" y="228" text-anchor="middle" font-family="Barlow,sans-serif" font-size="18" font-weight="800" fill="#fbbf24" opacity=".85">CORE</text>
</svg>
