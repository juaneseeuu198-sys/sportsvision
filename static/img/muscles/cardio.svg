<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- corazón central -->
  <path d="M 100,160 C 40,120 30,70 60,55 C 75,48 90,52 100,65 C 110,52 125,48 140,55 C 170,70 160,120 100,160 Z"
        fill="rgba(248,113,113,.22)" stroke="#f87171" stroke-width="2" stroke-linejoin="round"/>
  <!-- ECG / pulso cardíaco -->
  <polyline points="20,105 45,105 55,80 65,130 75,90 85,110 95,68 105,110 115,90 125,130 135,80 145,105 180,105"
            fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- puntos de energía -->
  <circle cx="55" cy="80" r="3" fill="#f87171" opacity=".7"/>
  <circle cx="95" cy="68" r="4" fill="#f87171" opacity=".9"/>
  <circle cx="135" cy="80" r="3" fill="#f87171" opacity=".7"/>
  <!-- figura corriendo (simplificada) -->
  <circle cx="100" cy="18" r="12" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.1)" stroke-width="1.5"/>
  <!-- label -->
  <text x="100" y="228" text-anchor="middle" font-family="Barlow,sans-serif" font-size="18" font-weight="800" fill="#f87171" opacity=".85">CARDIO</text>
</svg>
