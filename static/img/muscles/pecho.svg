<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- torso outline -->
  <path d="M 55,52 L 145,52 L 155,72 L 152,168 L 128,182 L 100,185 L 72,182 L 48,168 L 45,72 Z"
        fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.1)" stroke-width="1.5"/>
  <!-- hombros hint -->
  <ellipse cx="38" cy="80" rx="18" ry="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <ellipse cx="162" cy="80" rx="18" ry="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <!-- brazos hint -->
  <rect x="18" y="86" width="18" height="72" rx="8" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
  <rect x="164" y="86" width="18" height="72" rx="8" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
  <!-- PECTORAL IZQUIERDO -->
  <polygon points="50,55 100,64 100,112 52,114" fill="rgba(67,97,238,.28)" stroke="#4361ee" stroke-width="2" stroke-linejoin="round"/>
  <!-- PECTORAL DERECHO -->
  <polygon points="100,64 150,55 148,114 100,112" fill="rgba(67,97,238,.28)" stroke="#4361ee" stroke-width="2" stroke-linejoin="round"/>
  <!-- separación esternal -->
  <line x1="100" y1="58" x2="100" y2="114" stroke="#4361ee" stroke-width="1" opacity=".45"/>
  <!-- abdomen hint -->
  <rect x="78" y="118" width="14" height="14" rx="3" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
  <rect x="108" y="118" width="14" height="14" rx="3" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
  <rect x="78" y="136" width="14" height="14" rx="3" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
  <rect x="108" y="136" width="14" height="14" rx="3" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
  <!-- label -->
  <text x="100" y="222" text-anchor="middle" font-family="Barlow,sans-serif" font-size="18" font-weight="800" fill="#4361ee" opacity=".85">PECHO</text>
</svg>
