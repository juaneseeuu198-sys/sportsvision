name: Build Linux Binary

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpq-dev gcc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Crear db_config.txt y .env para bundlear en el ejecutable
        run: |
          printf '%s' "${{ secrets.DATABASE_URL }}" > db_config.txt
          printf 'DATABASE_URL=%s\nEMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend\nEMAIL_HOST=smtp.gmail.com\nEMAIL_PORT=587\nEMAIL_USE_TLS=True\nEMAIL_HOST_USER=%s\nEMAIL_HOST_PASSWORD=%s\nDEFAULT_FROM_EMAIL=SportsVision <%s>\nFRONTEND_URL=%s\n' \
            "${{ secrets.DATABASE_URL }}" \
            "${{ secrets.EMAIL_HOST_USER }}" \
            "${{ secrets.EMAIL_HOST_PASSWORD }}" \
            "${{ secrets.EMAIL_HOST_USER }}" \
            "${{ secrets.FRONTEND_URL }}" > .env

      - name: Migrations con SQLite local (para el build del .exe)
        run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: sportsvision.settings

      - name: Seed exercises en SQLite local
        run: python manage.py seed_exercises
        env:
          DJANGO_SETTINGS_MODULE: sportsvision.settings

      - name: Collect static files
        run: python manage.py collectstatic --noinput
        env:
          DJANGO_SETTINGS_MODULE: sportsvision.settings

      - name: Build Linux binary
        run: pyinstaller SportsVision.spec --clean

      - name: Make binary executable
        run: chmod +x dist/SportsVision

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: SportsVision-linux
          path: dist/SportsVision
          retention-days: 30

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Crear db_config.txt y .env para bundlear en el ejecutable
        run: |
          [System.IO.File]::WriteAllText("db_config.txt", "${{ secrets.DATABASE_URL }}")
          $envContent = "DATABASE_URL=${{ secrets.DATABASE_URL }}`nEMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend`nEMAIL_HOST=smtp.gmail.com`nEMAIL_PORT=587`nEMAIL_USE_TLS=True`nEMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}`nEMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}`nDEFAULT_FROM_EMAIL=SportsVision <${{ secrets.EMAIL_HOST_USER }}>`nFRONTEND_URL=${{ secrets.FRONTEND_URL }}"
          [System.IO.File]::WriteAllText(".env", $envContent)

      - name: Migrations con SQLite local (para el build del .exe)
        run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: sportsvision.settings

      - name: Seed exercises en SQLite local
        run: python manage.py seed_exercises
        env:
          DJANGO_SETTINGS_MODULE: sportsvision.settings

      - name: Collect static files
        run: python manage.py collectstatic --noinput
        env:
          DJANGO_SETTINGS_MODULE: sportsvision.settings

      - name: Build Windows executable
        run: pyinstaller SportsVision.spec --clean

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: SportsVision-windows
          path: dist/SportsVision.exe
          retention-days: 30
