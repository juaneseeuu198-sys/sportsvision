name: Build Linux Binary

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpq-dev gcc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Crear db_config.txt y .env desde Secrets
        run: |
          echo "${{ secrets.DATABASE_URL }}" > db_config.txt
          cat > .env << 'EOF'
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST=smtp.gmail.com
          EMAIL_PORT=587
          EMAIL_USE_TLS=True
          EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL=SportsVision <${{ secrets.EMAIL_HOST_USER }}>
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          EOF

      - name: Apply migrations
        run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: sportsvision.settings
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed exercises
        run: python manage.py seed_exercises
        env:
          DJANGO_SETTINGS_MODULE: sportsvision.settings
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Collect static files
        run: python manage.py collectstatic --noinput
        env:
          DJANGO_SETTINGS_MODULE: sportsvision.settings

      - name: Build Linux binary
        run: pyinstaller SportsVision.spec --clean

      - name: Make binary executable
        run: chmod +x dist/SportsVision

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: SportsVision-linux
          path: dist/SportsVision
          retention-days: 30

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Crear db_config.txt y .env desde Secrets
        run: |
          "${{ secrets.DATABASE_URL }}" | Out-File -FilePath db_config.txt -Encoding utf8 -NoNewline
          @"
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST=smtp.gmail.com
          EMAIL_PORT=587
          EMAIL_USE_TLS=True
          EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL=SportsVision <${{ secrets.EMAIL_HOST_USER }}>
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          "@ | Out-File -FilePath .env -Encoding utf8

      - name: Apply migrations
        run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: sportsvision.settings
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed exercises
        run: python manage.py seed_exercises
        env:
          DJANGO_SETTINGS_MODULE: sportsvision.settings
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Collect static files
        run: python manage.py collectstatic --noinput
        env:
          DJANGO_SETTINGS_MODULE: sportsvision.settings

      - name: Build Windows executable
        run: pyinstaller SportsVision.spec --clean

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: SportsVision-windows
          path: dist/SportsVision.exe
          retention-days: 30
