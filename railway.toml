[build]
builder = "NIXPACKS"
buildCommand = "python manage.py collectstatic --noinput"

[deploy]
startCommand = "python manage.py migrate && python manage.py seed_exercises && python manage.py setup_admin && python manage.py compile_messages && gunicorn sportsvision.wsgi --log-file -"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
